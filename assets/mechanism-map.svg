<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Five PHP2Shell mechanism families</title><desc id="desc">Five distinct research mechanism families with proof boundaries.</desc><rect width="1200" height="760" rx="24" fill="#08111f"/><text x="55" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">Five mechanism families — one evidence model</text><text x="55" y="105" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Target effects are not CVE counts, prevalence claims, or proof of default deployment reachability.</text><rect x="55" y="145" width="1090" height="105" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><circle cx="95" cy="197" r="28" fill="#22d3ee"/><text x="95" y="205" text-anchor="middle" fill="#06111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900">01</text><text x="145" y="179" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">OOM-only corruption</text><text x="540" y="179" fill="#22d3ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">CVE-2026-109618</text><text x="145" y="209" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Single-request exceptional OOM path</text><text x="145" y="233" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Proof boundary: ASLR-off calibrated target effects</text><rect x="55" y="263" width="1090" height="105" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><circle cx="95" cy="315" r="28" fill="#f59e0b"/><text x="95" y="323" text-anchor="middle" fill="#06111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900">02</text><text x="145" y="297" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Cross-request stale state</text><text x="540" y="297" fill="#f59e0b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">CVE-2026-109618 + 109619</text><text x="145" y="327" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Producer → freed request heap → same-worker consumer</text><text x="145" y="351" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Proof boundary: Combined-chain RCE; no local standalone no-OOM RCE</text><rect x="55" y="381" width="1090" height="105" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/><circle cx="95" cy="433" r="28" fill="#8b5cf6"/><text x="95" y="441" text-anchor="middle" fill="#06111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900">03</text><text x="145" y="415" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Serializer mismatch</text><text x="540" y="415" fill="#8b5cf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">CVE-2026-115560</text><text x="145" y="445" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Upload-progress write → runtime handler switch → read</text><text x="145" y="469" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Proof boundary: Conditional installed-app target effects</text><rect x="55" y="499" width="1090" height="105" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2"/><circle cx="95" cy="551" r="28" fill="#10b981"/><text x="95" y="559" text-anchor="middle" fill="#06111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900">04</text><text x="145" y="533" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Session-file inclusion</text><text x="540" y="533" fill="#10b981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Independent application LFI prerequisite</text><text x="145" y="563" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Upload-progress session file → separate include sink</text><text x="145" y="587" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Proof boundary: 8 target effects / 24 controls</text><rect x="55" y="617" width="1090" height="105" rx="16" fill="#0f172a" stroke="#ef4444" stroke-width="2"/><circle cx="95" cy="669" r="28" fill="#ef4444"/><text x="95" y="677" text-anchor="middle" fill="#06111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900">05</text><text x="145" y="651" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Mid-script gadget decode</text><text x="540" y="651" fill="#ef4444" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Conditional / assignment unresolved</text><text x="145" y="681" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Guarded app fixture → session decode → gadget effect</text><text x="145" y="705" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Proof boundary: Mechanism proof; stock-app reachability open</text></svg>